<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIZZL Digital Twin — Evaluation</title>
<style>
body{font-family:system-ui,sans-serif;background:#080b0a;color:#e9fff4;max-width:1100px;margin:40px auto;padding:0 20px}
h1{letter-spacing:.04em}.intro{opacity:.75}.test{border:1px solid #254238;padding:16px;margin:12px 0;border-radius:10px}
.q{font-weight:700}.expected{opacity:.75;margin-top:7px}.status{margin-top:12px;display:flex;gap:8px;align-items:center}
button{background:#0d1713;color:#e9fff4;border:1px solid #4ddf9b;padding:7px 12px;border-radius:6px;cursor:pointer}
textarea{width:100%;min-height:70px;background:#0b100e;color:#e9fff4;border:1px solid #254238;border-radius:6px;margin-top:10px;padding:10px;box-sizing:border-box}
</style>
</head>
<body>
<h1>FIZZL DIGITAL TWIN / EVALUATION</h1>
<p class="intro">Manual regression suite for grounding, context and hallucination resistance.</p>
<div id="tests"></div>
<script>
fetch("evaluation-suite.json").then(r=>r.json()).then(data=>{
 const root=document.querySelector("#tests");
 data.tests.forEach(t=>{
   const el=document.createElement("section");
   el.className="test";
   el.innerHTML=`<div class="q">${t.id} · ${t.category}</div>
   <div>${t.question}</div>
   <div class="expected"><b>Expected:</b> ${t.expected}</div>
   <div class="status">
     <button data-status="PASS">PASS</button>
     <button data-status="REVIEW">REVIEW</button>
     <button data-status="FAIL">FAIL</button>
   </div>
   <textarea placeholder="Paste/record the model answer and reviewer notes…"></textarea>`;
   el.querySelectorAll("button").forEach(b=>b.onclick=()=>el.dataset.result=b.dataset.status);
   root.appendChild(el);
 });
});
</script>
</body>
</html>
